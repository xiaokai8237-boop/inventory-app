<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>需求9 竖①首页 - 物流筐</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1920px;
    background: radial-gradient(ellipse at 50% 0%, #0E3340 0%, #082E38 60%, #051F26 100%);
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
  }
  /* 星空点 */
  body::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 80px 180px, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 200px 320px, rgba(245,220,146,.3), transparent),
      radial-gradient(1.5px 1.5px at 380px 90px, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 550px 240px, rgba(124,232,224,.3), transparent),
      radial-gradient(1px 1px at 700px 150px, rgba(255,255,255,.3), transparent),
      radial-gradient(1.5px 1.5px at 870px 280px, rgba(245,220,146,.4), transparent),
      radial-gradient(1px 1px at 980px 80px, rgba(255,255,255,.35), transparent);
  }
  .brand {
    position: relative; z-index: 2;
    padding: 50px 70px 20px;
    text-align: center;
  }
  .logo {
    width: 110px; height: 110px; margin: 0 auto 22px;
    background: linear-gradient(135deg, #F5DC92 0%, #E0A63E 100%);
    border-radius: 26px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 32px rgba(245,220,146,.45), inset 0 -3px 10px rgba(0,0,0,.18);
  }
  .logo svg { width: 60px; height: 60px; }
  .title {
    font-size: 64px; font-weight: 900; color: #fff;
    text-shadow: 0 4px 24px rgba(245,220,146,.35);
    letter-spacing: 2px; margin-bottom: 12px;
  }
  .sub {
    font-size: 26px; color: #F5DC92; font-weight: 700;
    letter-spacing: 6px; margin-bottom: 18px;
  }
  .slogan {
    font-size: 28px; color: rgba(255,255,255,.78); font-weight: 400;
  }
  .phone-wrap {
    position: relative; z-index: 2;
    display: flex; justify-content: center; margin-top: 30px;
  }
  .phone {
    width: 540px; height: 1170px;
    border-radius: 44px;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,.16);
    box-shadow: 0 26px 70px rgba(0,0,0,.6), 0 0 0 8px rgba(245,220,146,.08);
    background: #051F26;
  }
  .phone img {
    width: 100%; height: 100%; display: block;
    object-fit: cover; object-position: top;
  }
  .features {
    position: relative; z-index: 2;
    padding: 24px 60px 0;
    display: flex; gap: 18px; justify-content: center;
  }
  .feat-row {
    flex: 1;
    background: rgba(245,220,146,.06);
    border: 1.5px solid rgba(245,220,146,.28);
    border-radius: 20px;
    padding: 22px 18px;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; gap: 12px;
  }
  .feat-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #F5DC92 0%, #E0A63E 100%);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(245,220,146,.3);
  }
  .feat-icon svg { width: 32px; height: 32px; stroke: #1A2730; }
  .feat-title {
    font-size: 24px; font-weight: 700; color: #F5DC92;
  }
  .feat-desc {
    font-size: 18px; color: rgba(255,255,255,.7); font-weight: 400;
    line-height: 1.45;
  }
  .ver {
    position: absolute; bottom: 22px; left: 0; right: 0;
    text-align: center; font-size: 18px; color: rgba(255,255,255,.35);
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1A2730" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </div>
    <div class="title">物流筐 收发管理系统</div>
    <div class="sub">送货记账 · 到店提醒 · 云端备份</div>
    <div class="slogan">首页一眼看清，今日全部搞定</div>
  </div>

  <div class="phone-wrap">
    <div class="phone">
      <img src="_shot_req9_s1_home.png" alt="首页截图">
    </div>
  </div>

  <div class="features">
    <div class="feat-row">
      <div class="feat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </div>
      <div class="feat-title">发出回收</div>
      <div class="feat-desc">一键直达<br>大按钮</div>
    </div>
    <div class="feat-row">
      <div class="feat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><rect x="7" y="13" width="3" height="5"/><rect x="12" y="9" width="3" height="9"/><rect x="17" y="5" width="3" height="13"/>
        </svg>
      </div>
      <div class="feat-title">今日状态</div>
      <div class="feat-desc">一屏掌握<br>100% 进度</div>
    </div>
    <div class="feat-row">
      <div class="feat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5-5 5 5"/><path d="M12 15V3"/>
        </svg>
      </div>
      <div class="feat-title">云端备份</div>
      <div class="feat-desc">离线可用<br>换机不丢</div>
    </div>
  </div>

  <div class="ver">v8.2.7</div>
</body>
</html>
