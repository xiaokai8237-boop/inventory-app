<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>需求9 竖屏 - {{TITLE}}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1920px;
    background: radial-gradient(ellipse at 50% 0%, #0E3340 0%, #082E38 60%, #051F26 100%);
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 80px 180px, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 200px 320px, rgba(245,220,146,.3), transparent),
      radial-gradient(1.5px 1.5px at 380px 90px, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 700px 150px, rgba(255,255,255,.3), transparent),
      radial-gradient(1.5px 1.5px at 870px 280px, rgba(245,220,146,.4), transparent);
  }
  .brand {
    position: relative; z-index: 2;
    padding: 50px 70px 20px;
    text-align: center;
  }
  .logo {
    width: 100px; height: 100px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #F5DC92 0%, #E0A63E 100%);
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 28px rgba(245,220,146,.45), inset 0 -3px 10px rgba(0,0,0,.18);
  }
  .logo svg { width: 54px; height: 54px; }
  .eyebrow {
    font-size: 22px; color: #F5DC92; font-weight: 700;
    letter-spacing: 4px; margin-bottom: 10px;
  }
  .title {
    font-size: 56px; font-weight: 900; color: #fff; line-height: 1.2;
    text-shadow: 0 3px 18px rgba(245,220,146,.3);
    letter-spacing: 1px; margin-bottom: 14px;
  }
  .slogan {
    font-size: 26px; color: rgba(255,255,255,.78); font-weight: 400;
  }
  .phone-wrap {
    position: relative; z-index: 2;
    display: flex; justify-content: center; margin-top: 28px;
  }
  .phone {
    width: 540px; height: 1170px;
    border-radius: 44px;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,.16);
    box-shadow: 0 26px 70px rgba(0,0,0,.6), 0 0 0 8px rgba(245,220,146,.08);
    background: #051F26;
  }
  .phone img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: top; }
  .features {
    position: relative; z-index: 2;
    padding: 22px 60px 0;
    display: flex; gap: 16px; justify-content: center;
  }
  .feat-row {
    flex: 1;
    background: rgba(245,220,146,.06);
    border: 1.5px solid rgba(245,220,146,.28);
    border-radius: 18px;
    padding: 20px 16px;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; gap: 10px;
  }
  .feat-icon {
    width: 50px; height: 50px;
    background: linear-gradient(135deg, #F5DC92 0%, #E0A63E 100%);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 12px rgba(245,220,146,.3);
  }
  .feat-icon svg { width: 28px; height: 28px; stroke: #1A2730; }
  .feat-title { font-size: 22px; font-weight: 700; color: #F5DC92; }
  .feat-desc { font-size: 17px; color: rgba(255,255,255,.7); line-height: 1.45; }
  .ver {
    position: absolute; bottom: 22px; left: 0; right: 0;
    text-align: center; font-size: 18px; color: rgba(255,255,255,.35);
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1A2730" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </div>
    <div class="eyebrow">FEATURE 0{{IDX}}</div>
    <div class="title">{{TITLE}}</div>
    <div class="slogan">{{SLOGAN}}</div>
  </div>

  <div class="phone-wrap">
    <div class="phone">
      <img src="{{IMG}}" alt="截图">
    </div>
  </div>

  <div class="features">
    <div class="feat-row">
      <div class="feat-icon">{{F1_ICON}}</div>
      <div class="feat-title">{{F1_T}}</div>
      <div class="feat-desc">{{F1_D}}</div>
    </div>
    <div class="feat-row">
      <div class="feat-icon">{{F2_ICON}}</div>
      <div class="feat-title">{{F2_T}}</div>
      <div class="feat-desc">{{F2_D}}</div>
    </div>
    <div class="feat-row">
      <div class="feat-icon">{{F3_ICON}}</div>
      <div class="feat-title">{{F3_T}}</div>
      <div class="feat-desc">{{F3_D}}</div>
    </div>
  </div>

  <div class="ver">v8.2.7</div>
</body>
</html>
