<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1A22">
<title>物流筐 · 管理</title>
<style>
:root {
  --bg:#0A1A22; --card:#0E3340; --card2:#123B49; --gold:#F5DC92; --gold2:#E0A63E;
  --cyan:#7CE8E0; --text:#CFECEF; --dim:#8FA3AE; --danger:#FF6B6B; --ok:#6BDBA1;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
button { font-family:inherit; cursor:pointer; }
input,select { font-family:inherit; }

/* ===== 登录页 ===== */
#loginPage { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
.login-card { width:100%; max-width:340px; background:var(--card); border:1.5px solid rgba(245,220,146,.5); border-radius:22px; padding:32px 24px 26px; }
.login-logo { width:60px; height:60px; margin:0 auto 14px; border-radius:16px; background:linear-gradient(135deg,#1B4A5A,#0E3340); border:1px solid rgba(245,220,146,.4); display:flex; align-items:center; justify-content:center; }
.login-title { text-align:center; font-size:18px; font-weight:900; color:var(--gold); letter-spacing:1px; }
.login-sub { text-align:center; font-size:11px; color:var(--dim); margin:6px 0 22px; }
.login-input { width:100%; padding:12px 14px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); color:var(--text); font-size:15px; letter-spacing:1px; outline:none; }
.login-input:focus { border-color:var(--gold); }
.login-btn { width:100%; margin-top:16px; padding:12px 0; border-radius:20px; background:linear-gradient(135deg,#F8E3A6,#E0A63E); color:#0B2E38; font-size:15px; font-weight:900; border:none; box-shadow:0 4px 14px rgba(224,166,62,.35); }
.login-err { color:var(--danger); font-size:12px; text-align:center; margin-top:10px; min-height:16px; }

/* ===== 主界面 ===== */
#mainPage { display:none; max-width:520px; margin:0 auto; padding:0 0 64px; }
.m-head { position:sticky; top:0; z-index:10; background:rgba(10,26,34,.92); backdrop-filter:blur(8px); padding:14px 16px 10px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,.06); }
.m-title { font-size:16px; font-weight:900; color:var(--gold); display:flex; align-items:center; gap:8px; }
.m-logout { font-size:12px; color:var(--dim); background:none; border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:5px 10px; }
.m-body { padding:12px 14px 20px; }

.card { background:var(--card); border-radius:16px; padding:14px; margin-bottom:12px; border:1px solid rgba(255,255,255,.06); }
.card-title { font-size:14px; font-weight:800; color:var(--text); display:flex; align-items:center; gap:6px; margin-bottom:10px; }
.card-title .ic { color:var(--gold); }

/* 概览 */
.ov-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ov-cell { background:var(--card2); border-radius:12px; padding:12px; text-align:center; }
.ov-num { font-size:22px; font-weight:900; color:var(--gold); }
.ov-num.cyan { color:var(--cyan); }
.ov-num.red { color:var(--danger); }
.ov-lab { font-size:11px; color:var(--dim); margin-top:3px; }
.listen-pill { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:20px; font-size:12px; font-weight:800; }
.listen-pill.on { background:rgba(107,219,161,.12); color:var(--ok); border:1px solid rgba(107,219,161,.5); }
.listen-pill.off { background:rgba(255,107,107,.1); color:var(--danger); border:1px solid rgba(255,107,107,.5); }

/* 用户列表 */
.u-row { display:flex; align-items:center; justify-content:space-between; padding:9px 2px; border-bottom:1px solid rgba(255,255,255,.05); font-size:12px; }
.u-row:last-child { border-bottom:none; }
.u-phone { font-weight:800; color:var(--text); letter-spacing:.5px; }
.u-meta { color:var(--dim); font-size:11px; margin-top:2px; }
.u-vip { color:var(--gold); font-size:11px; font-weight:700; }
.u-btn { font-size:11px; padding:4px 9px; border-radius:9px; border:1px solid rgba(245,220,146,.4); color:var(--gold); background:rgba(245,220,146,.08); }

/* 表单 */
.f-label { font-size:12px; color:var(--dim); margin:10px 0 4px; }
.f-input,.f-select { width:100%; padding:10px 12px; border-radius:11px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); color:var(--text); font-size:14px; outline:none; }
.f-input:focus { border-color:var(--gold); }
.f-btn { width:100%; margin-top:12px; padding:11px 0; border-radius:18px; background:linear-gradient(135deg,#F8E3A6,#E0A63E); color:#0B2E38; font-size:14px; font-weight:900; border:none; box-shadow:0 4px 12px rgba(224,166,62,.3); }
.f-btn.ghost { background:rgba(255,255,255,.07); color:var(--text); border:1px solid rgba(255,255,255,.18); box-shadow:none; }

/* 收款设置 */
.qr-upload { display:flex; gap:10px; margin-bottom:6px; }
.qr-box { flex:1; text-align:center; }
.qr-box img { width:88px; height:88px; border-radius:10px; background:#fff; object-fit:contain; border:1px solid rgba(255,255,255,.1); }
.qr-box .qr-name { font-size:11px; color:var(--dim); margin:5px 0 4px; }
.qr-box input[type=file] { display:none; }
.qr-box label { font-size:11px; color:var(--cyan); border:1px dashed rgba(124,232,224,.5); border-radius:8px; padding:4px 8px; display:inline-block; cursor:pointer; }

/* 对账 */
.rc-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
.rc-cell { background:var(--card2); border-radius:10px; padding:10px 6px; text-align:center; }
.rc-num { font-size:18px; font-weight:900; }
.rc-lab { font-size:10px; color:var(--dim); margin-top:2px; }
.flow-row { display:flex; align-items:center; justify-content:space-between; padding:8px 2px; border-bottom:1px solid rgba(255,255,255,.05); font-size:12px; }
.flow-amt { font-weight:800; color:var(--text); }
.flow-amt.un { color:var(--danger); }
.flow-meta { font-size:10px; color:var(--dim); margin-top:2px; }
.badge { font-size:10px; padding:2px 7px; border-radius:8px; font-weight:700; }
.badge.ok { background:rgba(107,219,161,.12); color:var(--ok); }
.badge.un { background:rgba(255,107,107,.12); color:var(--danger); }

/* 底部 Tab */
.m-tabbar { position:fixed; bottom:0; left:0; right:0; z-index:20; background:rgba(14,51,64,.97); border-top:1px solid rgba(245,220,146,.2); display:flex; max-width:520px; margin:0 auto; }
.tab { flex:1; padding:9px 0 11px; text-align:center; color:var(--dim); font-size:11px; background:none; border:none; }
.tab .tic { display:flex; justify-content:center; margin-bottom:2px; }
.tab.on { color:var(--gold); }
.tab.on .tic { color:var(--gold); }

.empty { text-align:center; color:var(--dim); font-size:12px; padding:18px 0; }
.toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:#123B49; color:var(--text); border:1px solid rgba(245,220,146,.5); padding:9px 18px; border-radius:20px; font-size:13px; z-index:99; display:none; }
.toast.show { display:block; animation:fadeIn .2s; }
@keyframes fadeIn { from{opacity:0;transform:translate(-50%,-8px)} to{opacity:1;transform:translate(-50%,0)} }
</style>
</head>
<body>

<!-- 登录 -->
<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#F5DC92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 7h10v10H7z"/><path d="M7 12h10"/><path d="M12 7v10"/></svg>
    </div>
    <div class="login-title">物流筐 · 管理</div>
    <div class="login-sub">收款监听 · 用户管理 · 对账补发</div>
    <input class="login-input" id="loginPwd" type="password" placeholder="输入管理密码" autocomplete="off">
    <button class="login-btn" onclick="doLogin()">进入管理</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="mainPage">
  <div class="m-head">
    <div class="m-title">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/></svg>
      物流筐 · 管理
    </div>
    <button class="m-logout" onclick="doLogout()">退出</button>
  </div>
  <div class="m-body" id="tabContent"></div>
  <div class="m-tabbar">
    <button class="tab on" data-tab="overview" onclick="switchTab('overview')">
      <span class="tic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span>
      概览
    </button>
    <button class="tab" data-tab="users" onclick="switchTab('users')">
      <span class="tic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
      用户
    </button>
    <button class="tab" data-tab="grant" onclick="switchTab('grant')">
      <span class="tic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2 1.1 0 2-.9 2-2 0-1.1-.9-2-2-2z"/></svg></span>
      补发
    </button>
    <button class="tab" data-tab="config" onclick="switchTab('config')">
      <span class="tic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
      设置
    </button>
    <button class="tab" data-tab="reconcile" onclick="switchTab('reconcile')">
      <span class="tic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg></span>
      对账
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="admin-listen.js"></script>
<script src="admin.js"></script>
</body>
</html>
